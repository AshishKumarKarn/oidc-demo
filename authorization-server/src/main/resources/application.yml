server:
  port: 9000

spring:
  application:
    name: authorization-server
  thymeleaf:
    cache: false

# Custom OIDC settings consumed by AuthServerProperties.
oidc:
  # The "issuer" identifier. Every token's `iss` claim equals this value, and it is the
  # base of the discovery document. Clients and resource servers trust tokens from this issuer.
  issuer: http://localhost:9000
  # Lifetimes (in seconds) for the artifacts we mint.
  authorization-code-ttl-seconds: 60
  access-token-ttl-seconds: 300
  id-token-ttl-seconds: 300
  # Refresh tokens live far longer than access tokens; the client trades one in for a fresh access
  # token (and a rotated refresh token) without sending the user back through login.
  refresh-token-ttl-seconds: 3600

logging:
  level:
    com.example.oidc: DEBUG
