<!DOCTYPE html>
<!-- Home page of the relying party. Entry point into the OIDC login flow. -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>OIDC Demo Client</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 60px; }
        .card { background: #fff; padding: 32px 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 420px; }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { color: #555; line-height: 1.5; }
        a.btn { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #2d6cdf; color: #fff; text-decoration: none; border-radius: 6px; }
        a.btn:hover { background: #2459bd; }
        code { background: #eef2ff; padding: 1px 5px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="card">
    <h1>OIDC Demo &mdash; Service Provider</h1>
    <p>This is the relying party. It logs you in via the OpenID Provider at
        <code th:text="${issuer}">http://localhost:9000</code> using the Authorization Code flow with PKCE,
        then calls a protected API with the access token.</p>

    <div th:if="${!loggedIn}">
        <a class="btn" href="/login">Sign in with OpenID Provider</a>
    </div>
    <div th:if="${loggedIn}">
        <p>You are signed in.</p>
        <a class="btn" href="/profile">Go to your profile</a>
        &nbsp;<a href="/logout">Log out</a>
    </div>
</div>
</body>
</html>
