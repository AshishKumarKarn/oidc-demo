server:
  port: 9100

spring:
  application:
    name: resource-server

# Where to validate tokens against. These values drive AccessTokenValidator.
resource-server:
  # Must equal the OP's issuer claim.
  issuer: http://localhost:9000
  # Where to fetch the signing keys (JWK Set). Usually discovered, hard-coded here for clarity.
  jwks-uri: http://localhost:9000/.well-known/jwks.json
  # The `aud` value this API expects in access tokens.
  audience: resource-server

logging:
  level:
    com.example.oidc: DEBUG
