<!DOCTYPE html>
<!--
  Login page rendered by the authorization endpoint (GET /authorize).

  Every OIDC authorization-request parameter is carried forward as a hidden field so it survives the
  POST /login submission. The user only types a username + password; on success the controller issues
  an authorization code and redirects back to the client.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sign in &middot; Demo OpenID Provider</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; justify-content: center; padding-top: 60px; }
        .card { background: #fff; padding: 32px 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.08); width: 320px; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        .sub { color: #777; font-size: 13px; margin-bottom: 20px; }
        label { display: block; font-size: 13px; margin: 12px 0 4px; color: #333; }
        input[type=text], input[type=password] { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { margin-top: 20px; width: 100%; padding: 10px; background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; font-size: 15px; cursor: pointer; }
        button:hover { background: #2459bd; }
        .error { background: #fde8e8; color: #b91c1c; padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
        .hint { margin-top: 16px; font-size: 12px; color: #888; text-align: center; }
        .scope { font-size: 12px; color: #555; background: #eef2ff; padding: 6px 8px; border-radius: 6px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Demo OpenID Provider</h1>
    <div class="sub">Sign in to continue to <strong th:text="${clientId}">client</strong></div>

    <div class="scope">Requested scopes: <span th:text="${scope}">openid</span></div>

    <div class="error" th:if="${error}" th:text="${error}">error</div>

    <form method="post" action="/login">
        <!-- Visible credential fields -->
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autofocus autocomplete="username"/>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password"/>

        <!-- Hidden: the original authorization-request parameters, replayed on submit -->
        <input type="hidden" name="client_id" th:value="${clientId}"/>
        <input type="hidden" name="redirect_uri" th:value="${redirectUri}"/>
        <input type="hidden" name="scope" th:value="${scope}"/>
        <input type="hidden" name="state" th:value="${state}"/>
        <input type="hidden" name="nonce" th:value="${nonce}"/>
        <input type="hidden" name="code_challenge" th:value="${codeChallenge}"/>
        <input type="hidden" name="code_challenge_method" th:value="${codeChallengeMethod}"/>

        <button type="submit">Sign in</button>
    </form>

    <div class="hint">Demo users: <code>alice</code> / <code>bob</code> &middot; password: <code>password</code></div>
</div>
</body>
</html>
